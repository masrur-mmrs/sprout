name: sprout

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprout_dev
    ports:
      # Loopback only. Set POSTGRES_PORT (e.g. 5433) if another Postgres already uses 5432,
      # and change the port in backend/.env to match.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is empty; creates sprout_test.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprout_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
